<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy OS - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.3);
            border-radius: 10px;
        }
        
        .slide-in {
            transform: translate(0, -50%) !important;
        }
        .fade-out-left {
            transform: translateX(-150%);
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-[url('/static/assets/landing_bg.png')] bg-cover bg-center bg-no-repeat min-h-screen relative overflow-hidden text-gray-900">
    
    <!-- Optional dark overlay to ensure text visibility on any background -->
    <div class="absolute inset-0 bg-indigo-900/30 backdrop-blur-[2px]"></div>

    <!-- Top Left Brand -->
    <div class="absolute top-8 left-8 z-10 flex items-center gap-3 drop-shadow-md">
        <div class="w-12 h-12 rounded-xl bg-white/20 backdrop-blur-md border border-white/50 flex items-center justify-center overflow-hidden shadow-sm">
            <img src="/static/assets/logo.png" alt="Aster Logo" class="w-full h-full object-cover">
        </div>
        <div class="flex flex-col text-white">
            <span class="text-2xl font-bold tracking-tight leading-none">aster</span>
            <span class="text-[10px] font-semibold tracking-widest mt-1 opacity-80">PHARMACY OS</span>
        </div>
    </div>

    <!-- Top Right: Terms and Conditions -->
    <div class="absolute top-8 right-8 z-[15] drop-shadow-md">
        <button onclick="openInfoModal('terms')" class="text-white/80 hover:text-white text-sm font-semibold tracking-wide transition-colors">
            Terms & Conditions
        </button>
    </div>

    <!-- Footer: Policies -->
    <div class="absolute bottom-6 left-0 right-0 z-[15] flex justify-center items-center gap-6 drop-shadow-md text-white/70 text-xs font-medium tracking-wide">
        <button onclick="openInfoModal('privacy')" class="hover:text-white transition-colors">Privacy Policy</button>
        <span class="w-1 h-1 rounded-full bg-white/40"></span>
        <button onclick="openInfoModal('data')" class="hover:text-white transition-colors">What Data We Collect</button>
        <span class="w-1 h-1 rounded-full bg-white/40"></span>
        <button onclick="openInfoModal('cookie')" class="hover:text-white transition-colors">Cookie Policy</button>
    </div>

    <!-- Center Selection Area -->
    <div class="absolute inset-0 flex items-center justify-center z-10 transition-all duration-700 ease-in-out" id="selectionArea">
        <div class="flex gap-8 md:gap-16 flex-col md:flex-row">
            
            <!-- Admin Button Group -->
            <div class="relative group cursor-pointer">
                <button class="w-44 h-12 rounded-[2rem] bg-gradient-to-r from-white/70 to-white/40 backdrop-blur-lg border border-white text-black text-[13px] font-bold tracking-widest shadow-xl hover:from-white/80 hover:to-white/50 transition-all flex items-center justify-center group-hover:-translate-y-1">
                    ADMIN
                </button>
                
                <!-- Hover Menu for Admin -->
                <div class="absolute top-full left-1/2 -translate-x-1/2 pt-4 w-56 opacity-0 translate-y-2 pointer-events-none group-hover:opacity-100 group-hover:translate-y-0 group-hover:pointer-events-auto transition-all duration-300">
                    <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-white/50 overflow-hidden">
                        <button onclick="openPanel('login', 'admin')" class="w-full text-left px-5 py-4 hover:bg-indigo-50 text-indigo-900 font-semibold border-b border-gray-100 flex items-center gap-3 transition-colors">
                            <span class="material-symbols-outlined text-[20px] text-indigo-500">login</span> Login
                        </button>
                        <button onclick="openPanel('register-admin')" class="w-full text-left px-5 py-4 hover:bg-indigo-50 text-indigo-900 font-semibold flex items-center gap-3 transition-colors">
                            <span class="material-symbols-outlined text-[20px] text-indigo-500">storefront</span> New Register
                        </button>
                    </div>
                </div>
            </div>

            <!-- Employee Button Group -->
            <div class="relative group cursor-pointer">
                <button class="w-44 h-12 rounded-[2rem] bg-gradient-to-r from-white/70 to-white/40 backdrop-blur-lg border border-white text-black text-[13px] font-bold tracking-widest shadow-xl hover:from-white/80 hover:to-white/50 transition-all flex items-center justify-center group-hover:-translate-y-1">
                    EMPLOYEE
                </button>
                
                <!-- Hover Menu for Employee -->
                <div class="absolute top-full left-1/2 -translate-x-1/2 pt-4 w-56 opacity-0 translate-y-2 pointer-events-none group-hover:opacity-100 group-hover:translate-y-0 group-hover:pointer-events-auto transition-all duration-300">
                    <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-white/50 overflow-hidden">
                        <button onclick="openPanel('login')" class="w-full text-left px-5 py-4 hover:bg-indigo-50 text-indigo-900 font-semibold border-b border-gray-100 flex items-center gap-3 transition-colors">
                            <span class="material-symbols-outlined text-[20px] text-indigo-500">login</span> Login
                        </button>
                        <button onclick="openPanel('register-employee')" class="w-full text-left px-5 py-4 hover:bg-indigo-50 text-indigo-900 font-semibold flex items-center gap-3 transition-colors">
                            <span class="material-symbols-outlined text-[20px] text-indigo-500">badge</span> New Staff
                        </button>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Centered Form Modal (Fades in) -->
    <div id="formContainer" class="absolute inset-0 flex items-center justify-center z-20 pointer-events-none opacity-0 transition-opacity duration-500 ease-in-out">
        <div class="w-full max-w-md bg-white/70 backdrop-blur-xl border border-white/60 rounded-3xl shadow-2xl flex flex-col max-h-[90vh] transform transition-transform duration-500 scale-95" id="formCard">
            <!-- Close button & Header -->
            <div class="p-8 pb-4 flex flex-col relative shrink-0">
                <button onclick="closePanel()" class="absolute top-6 right-6 w-10 h-10 bg-white/50 hover:bg-white border border-white/60 rounded-full flex items-center justify-center text-gray-800 shadow-sm transition-all">
                    <span class="material-symbols-outlined">close</span>
                </button>
                <div class="w-12 h-12 rounded-2xl bg-white/80 border border-white/60 text-indigo-700 flex items-center justify-center mb-4 shadow-sm" id="panelIcon">
                    <span class="material-symbols-outlined">local_police</span>
                </div>
                <h2 class="text-3xl font-bold tracking-tight text-gray-900 mb-2" id="panelTitle">Welcome back.</h2>
                <p class="text-gray-700 text-sm font-medium max-w-[280px]" id="panelDesc">Sign in to your pharmacy workspace.</p>
            </div>

            <!-- Scrollable Form Area -->
            <div class="flex-1 overflow-y-auto px-8 pb-8 custom-scrollbar">
                
                <!-- Login Form -->
                <form id="loginForm" class="space-y-5 hidden">
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-900">Email or Phone</label>
                        <input type="text" id="loginUsername" required class="block w-full px-4 py-3.5 border border-white/40 rounded-xl focus:ring-2 focus:ring-[#4F46E5] focus:border-transparent outline-none bg-white/60 backdrop-blur-sm shadow-sm transition-all text-gray-900 font-medium">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-900">Password</label>
                        <input type="password" id="loginPassword" required class="block w-full px-4 py-3.5 border border-white/40 rounded-xl focus:ring-2 focus:ring-[#4F46E5] focus:border-transparent outline-none bg-white/60 backdrop-blur-sm shadow-sm transition-all text-gray-900 font-medium">
                    </div>
                    <button type="submit" class="w-full flex items-center justify-center gap-2 py-3.5 bg-gray-900 hover:bg-black text-white rounded-xl font-bold tracking-wide shadow-lg transition-all active:scale-[0.98] mt-2">
                        LOGIN <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                    </button>
                    <div class="pt-4 text-center border-t border-gray-300 mt-6">
                        <button type="button" class="text-sm text-gray-700 font-bold hover:text-gray-900 underline decoration-gray-400 hover:decoration-gray-900 underline-offset-4 transition-colors">
                            Try another way (Number OTP)
                        </button>
                    </div>
                </form>

                <!-- Register Admin Form -->
                <form id="registerAdminForm" class="space-y-5 hidden">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-900">Store Name</label>
                            <input type="text" id="storeName" required placeholder="City Pharmacy" class="block w-full px-4 py-3 border border-white/40 rounded-xl focus:ring-2 focus:ring-[#4F46E5] focus:border-transparent outline-none bg-white/60 shadow-sm text-gray-900 font-medium">
                        </div>
                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-900">Owner Name</label>
                            <input type="text" id="ownerName" required placeholder="John Doe" class="block w-full px-4 py-3 border border-white/40 rounded-xl focus:ring-2 focus:ring-[#4F46E5] focus:border-transparent outline-none bg-white/60 shadow-sm text-gray-900 font-medium">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-900">Store Location</label>
                        <input type="text" id="storeLocation" required placeholder="Downtown, NY" class="block w-full px-4 py-3 border border-white/40 rounded-xl focus:ring-2 focus:ring-[#4F46E5] focus:border-transparent outline-none bg-white/60 shadow-sm text-gray-900 font-medium">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-900">Email Address (Login ID)</label>
                        <input type="email" id="adminEmail" required placeholder="admin@store.com" class="block w-full px-4 py-3 border border-white/40 rounded-xl focus:ring-2 focus:ring-[#4F46E5] focus:border-transparent outline-none bg-white/60 shadow-sm text-gray-900 font-medium">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-900">Password</label>
                        <input type="password" id="adminPassword" required placeholder="••••••••" minlength="8" class="block w-full px-4 py-3 border border-white/40 rounded-xl focus:ring-2 focus:ring-[#4F46E5] focus:border-transparent outline-none bg-white/60 shadow-sm text-gray-900 font-medium">
                    </div>
                    <button type="submit" class="w-full py-3.5 mt-2 bg-gray-900 hover:bg-black text-white rounded-xl font-bold tracking-wide shadow-lg transition-all active:scale-[0.98]">
                        CREATE STORE
                    </button>
                </form>

                <!-- Register Employee Form (Employee Login) -->
                <form id="registerEmployeeForm" class="space-y-5 hidden">
                    <div class="p-5 bg-white/80 rounded-xl border border-white/60 shadow-sm mb-2 relative overflow-hidden">
                        <label class="block text-sm font-bold text-gray-900 mb-2">Store UID</label>
                        <input type="text" id="storeUid" required placeholder="A1B2C3" class="block w-full px-4 py-3 border border-white/50 bg-white/60 rounded-lg focus:ring-2 focus:ring-[#4F46E5] focus:border-transparent outline-none font-mono text-lg tracking-widest uppercase">
                        <p class="text-xs text-gray-600 mt-2 font-medium">Ask your Owner/Admin for this code.</p>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-900">Your Full Name</label>
                        <input type="text" id="empName" required class="block w-full px-4 py-3 border border-white/40 rounded-xl focus:ring-2 focus:ring-[#4F46E5] focus:border-transparent outline-none bg-white/60 shadow-sm text-gray-900 font-medium">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-900">Email or Phone (Login ID)</label>
                        <input type="text" id="empEmail" required class="block w-full px-4 py-3 border border-white/40 rounded-xl focus:ring-2 focus:ring-[#4F46E5] focus:border-transparent outline-none bg-white/60 shadow-sm text-gray-900 font-medium">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-900">Password</label>
                        <input type="password" id="empPassword" required minlength="8" class="block w-full px-4 py-3 border border-white/40 rounded-xl focus:ring-2 focus:ring-[#4F46E5] focus:border-transparent outline-none bg-white/60 shadow-sm text-gray-900 font-medium">
                    </div>
                    <button type="submit" class="w-full py-3.5 mt-2 bg-gray-900 hover:bg-black text-white rounded-xl font-bold tracking-wide shadow-lg transition-all active:scale-[0.98]">
                        JOIN STORE
                    </button>
                </form>

            </div>
        </div>
    </div>

    <!-- Error Toast -->
    <div id="toast" class="fixed top-8 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur border border-gray-100 px-6 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 scale-95 pointer-events-none flex items-center gap-3 z-50">
        <span class="material-symbols-outlined text-red-500" id="toastIcon">error</span>
        <span id="toastMsg" class="font-medium text-gray-900 text-sm"></span>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-[2rem] p-10 max-w-sm w-full text-center shadow-2xl scale-95 transition-all transform animate-modal">
            <div class="w-20 h-20 bg-green-50 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <span class="material-symbols-outlined text-4xl">check_circle</span>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Store Created!</h2>
            <p class="text-gray-500 text-sm mb-6 leading-relaxed">Your store is ready. Share this UID with your employees so they can join your workspace:</p>
            <div class="bg-gray-50 border border-gray-200 p-5 rounded-2xl text-4xl font-mono tracking-widest font-bold text-[#4F46E5] mb-8 shadow-inner relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-[#4F46E5]"></div>
                <span id="createdUid">XXXXXX</span>
            </div>
            <button onclick="closeSuccess()" class="w-full py-4 bg-[#4F46E5] hover:bg-[#4338CA] text-white rounded-xl font-semibold shadow-lg shadow-indigo-500/30 transition-colors">Proceed to Login</button>
        </div>
    </div>

    <!-- Info Content Modal (T&C, Policies) -->
    <div id="infoModal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-[2rem] p-8 max-w-2xl w-full shadow-2xl scale-95 transition-all transform animate-modal flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900" id="infoTitle">Title</h2>
                <button onclick="closeInfoModal()" class="w-8 h-8 bg-gray-100 hover:bg-gray-200 rounded-full flex items-center justify-center text-gray-600 transition-colors">
                    <span class="material-symbols-outlined text-lg">close</span>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar pr-4 text-gray-600 text-sm leading-relaxed space-y-4" id="infoContent">
                <!-- Content injected here -->
            </div>
            <div class="mt-6 pt-6 border-t border-gray-100 text-right">
                <button onclick="closeInfoModal()" class="px-6 py-2.5 bg-gray-900 hover:bg-black text-white rounded-xl font-medium shadow-md transition-colors">Understood</button>
            </div>
        </div>
    </div>

    <style>
        @keyframes modal-pop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-modal {
            animation: modal-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>

    <script>
        function showToast(msg, isSuccess = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            document.getElementById('toastIcon').textContent = isSuccess ? 'check_circle' : 'error';
            document.getElementById('toastIcon').className = isSuccess ? 'material-symbols-outlined text-green-500' : 'material-symbols-outlined text-red-500';
            
            toast.classList.remove('opacity-0', 'scale-95');
            toast.classList.add('opacity-100', 'scale-100');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'scale-95');
                toast.classList.remove('opacity-100', 'scale-100');
            }, 4000);
        }

        const modalContents = {
            'terms': {
                title: 'Terms & Conditions',
                body: `<p>Welcome to Aster Pharmacy OS. By accessing or using our platform, you agree to be bound by these Terms and Conditions.</p>
                       <h3 class="font-bold text-gray-900 mt-4 mb-2">1. System Usage</h3>
                       <p>Our platform is provided for authorized pharmacy staff to manage inventory, billing, and reporting. Unauthorized access or misuse of the platform is strictly prohibited.</p>
                       <h3 class="font-bold text-gray-900 mt-4 mb-2">2. Data Accuracy</h3>
                       <p>You are responsible for ensuring all medical and inventory data entered into the system is accurate. We are not liable for medical errors resulting from incorrect data entry.</p>
                       <h3 class="font-bold text-gray-900 mt-4 mb-2">3. Service Availability</h3>
                       <p>While we strive for 99.9% uptime, the system is provided "as is" and we reserve the right to perform scheduled maintenance.</p>`
            },
            'privacy': {
                title: 'Privacy Policy',
                body: `<p>Your privacy is important to us. This policy outlines how we handle your personal and professional data within Aster Pharmacy OS.</p>
                       <h3 class="font-bold text-gray-900 mt-4 mb-2">Protection of Information</h3>
                       <p>We implement industry-standard security measures to ensure your data is protected against unauthorized access, alteration, or destruction. All passwords are securely hashed using PBKDF2 algorithms.</p>
                       <h3 class="font-bold text-gray-900 mt-4 mb-2">Third-Party Sharing</h3>
                       <p>We do not sell, trade, or otherwise transfer your personally identifiable information to outside parties without your explicit consent, except where required by law.</p>`
            },
            'data': {
                title: 'What Data We Collect',
                body: `<p>To provide you with our comprehensive pharmacy management services, we collect the following types of information:</p>
                       <ul class="list-disc pl-5 mt-2 space-y-2">
                           <li><strong>Account Information:</strong> Names, email addresses, phone numbers, and encrypted passwords.</li>
                           <li><strong>Pharmacy Operations:</strong> Store details, locations, and unique store UIDs.</li>
                           <li><strong>Operational Data:</strong> Inventory counts, supplier details, sales records, and employee actions (stored securely in our audit logs).</li>
                           <li><strong>System Usage:</strong> IP addresses, browser types, and standard web server log information for security diagnostics.</li>
                       </ul>`
            },
            'cookie': {
                title: 'Cookie Policy',
                body: `<p>Aster Pharmacy OS utilizes cookies and similar local storage technologies to enhance your experience and secure your sessions.</p>
                       <h3 class="font-bold text-gray-900 mt-4 mb-2">Essential Cookies (Local Storage)</h3>
                       <p>We use local storage strictly for maintaining your active session (authentication tokens) and saving your basic profile preferences (like your username and role). This allows you to navigate between pages without re-authenticating.</p>
                       <h3 class="font-bold text-gray-900 mt-4 mb-2">Analytics</h3>
                       <p>Currently, Aster Pharmacy OS does not deploy third-party tracking or advertising cookies. Our focus is entirely on your operational workflow.</p>`
            }
        };

        function openInfoModal(type) {
            const content = modalContents[type];
            document.getElementById('infoTitle').textContent = content.title;
            document.getElementById('infoContent').innerHTML = content.body;
            document.getElementById('infoModal').classList.remove('hidden');
            document.getElementById('infoModal').classList.add('flex');
        }

        function closeInfoModal() {
            document.getElementById('infoModal').classList.remove('flex');
            document.getElementById('infoModal').classList.add('hidden');
        }

        function openPanel(tab, context = '') {
            // Hide all forms
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerAdminForm').classList.add('hidden');
            document.getElementById('registerEmployeeForm').classList.add('hidden');

            const icon = document.querySelector('#panelIcon span');
            const title = document.getElementById('panelTitle');
            const desc = document.getElementById('panelDesc');

            if (tab === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
                icon.textContent = 'local_police';
                title.textContent = 'Welcome back.';
                desc.textContent = 'Sign in to your pharmacy workspace.';
            } else if (tab === 'register-admin') {
                document.getElementById('registerAdminForm').classList.remove('hidden');
                icon.textContent = 'storefront';
                title.textContent = 'Setup your store.';
                desc.textContent = 'Create a new multi-tenant instance for your pharmacy.';
            } else if (tab === 'register-employee') {
                document.getElementById('registerEmployeeForm').classList.remove('hidden');
                icon.textContent = 'badge';
                title.textContent = 'Join your team.';
                desc.textContent = 'Fill the details below to login/register to a store.';
            }

            // Fade out the selection area
            document.getElementById('selectionArea').classList.add('opacity-0', 'pointer-events-none');
            
            // Fade in the form container
            const container = document.getElementById('formContainer');
            container.classList.remove('opacity-0', 'pointer-events-none');
            container.classList.add('opacity-100', 'pointer-events-auto');
            
            // Scale up the card
            document.getElementById('formCard').classList.remove('scale-95');
            document.getElementById('formCard').classList.add('scale-100');
        }

        function closePanel() {
            // Fade out the form container
            const container = document.getElementById('formContainer');
            container.classList.add('opacity-0', 'pointer-events-none');
            container.classList.remove('opacity-100', 'pointer-events-auto');
            
            // Scale down the card
            document.getElementById('formCard').classList.add('scale-95');
            document.getElementById('formCard').classList.remove('scale-100');

            // Bring back the selection area
            document.getElementById('selectionArea').classList.remove('opacity-0', 'pointer-events-none');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('loginUsername').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    sessionStorage.setItem('token', data.access_token);
                    sessionStorage.setItem('role', data.role);
                    sessionStorage.setItem('name', data.full_name);
                    sessionStorage.setItem('store_name', data.store_name);
                    sessionStorage.setItem('username', document.getElementById('loginUsername').value);
                    window.location.href = '/dashboard';
                } else showToast(data.detail || 'Login failed');
            } catch(e) { showToast('Network error'); }
        });

        document.getElementById('registerAdminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch('/api/auth/register/store', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        store_name: document.getElementById('storeName').value,
                        owner_name: document.getElementById('ownerName').value,
                        location: document.getElementById('storeLocation').value,
                        email: document.getElementById('adminEmail').value,
                        password: document.getElementById('adminPassword').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('createdUid').textContent = data.store_uid;
                    document.getElementById('successModal').classList.remove('hidden');
                    document.getElementById('successModal').classList.add('flex');
                } else showToast(data.detail || 'Registration failed');
            } catch(e) { showToast('Network error'); }
        });

        document.getElementById('registerEmployeeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch('/api/auth/register/employee', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        store_uid: document.getElementById('storeUid').value.toUpperCase(),
                        full_name: document.getElementById('empName').value,
                        email: document.getElementById('empEmail').value,
                        password: document.getElementById('empPassword').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast(`Successfully joined ${data.store_name}! You can now login.`, true);
                    openPanel('login');
                } else showToast(data.detail || 'Registration failed');
            } catch(e) { showToast('Network error'); }
        });

        function closeSuccess() {
            document.getElementById('successModal').classList.remove('flex');
            document.getElementById('successModal').classList.add('hidden');
            openPanel('login');
        }
    </script>
</body>
</html>
